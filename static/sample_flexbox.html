<!DOCTYPE html>
<html>
<head>
  <title>Flexbox Table and Form</title>
  <link rel="stylesheet" href="css/w3schools.css">
</head>
<body>
  <div class="flex-form ligne item-start">
    <form action="{{ url_for('new') }}" , method="POST">
        <input type="text" name="name" placeholder="Job"><br>
        <input type="text" name="url" placeholder="Url"><br>
         <input type="text" name="zipCode" placeholder="zipCode"><br>
         <input type="text" name="company" placeholder="Company"><br>
         <input type="text" name="contact" placeholder="Contact"><br>
         <input type = "email" name = "email" placeholder = "E-Mail" /><br>
         <input type="submit" value="Ajout candidature">
    </form>
  </div>
  <div class="flex-table">
    <table>
      <!-- Your table content goes here -->
        <tr>
            <th>Offre</th>
            <th>URL</th>
            <th>Location</th>
            <th>Company</th>
        </tr>
        <tr>
            <td>Dev Python</td>
            <td>http://apec.fr</td>
            <td>Nice</td>
            <td>Pole Emploi</td>
        </tr>
    </table>
  </div>
</body>
</html>
